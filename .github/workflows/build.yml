name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python tools/make_icon.py
      - run: python -m PyInstaller --noconfirm --clean --noconsole --onefile --icon assets/icon.ico --add-data "assets;assets" --name SnapSolve --paths . --collect-all rapidocr_onnxruntime --collect-data wordninja --collect-submodules winrt --hidden-import winrt.windows.media.ocr --hidden-import winrt.windows.graphics.imaging --hidden-import winrt.windows.storage.streams --hidden-import winrt.windows.globalization --hidden-import winrt.windows.foundation --hidden-import winrt.windows.foundation.collections app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SnapSolve
          path: dist/SnapSolve.exe
